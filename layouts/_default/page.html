{{ define "main" }}
<div class="container mx-auto px-4 py-12 md:py-16 max-w-4xl">

    <!-- Card Container -->
    <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
        
        <!-- 1. PAGE HEADER -->
        <header class="px-6 py-10 md:px-12 md:py-12 bg-stone-50 border-b border-stone-100 text-center">
            <!-- Icon Gunung -->
            <div class="mb-4 flex justify-center text-emerald-600 opacity-80">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.8 9 10 9 10L4 17h16l-6-11zm-4 5.2l-2 3.8h4l-2-3.8z"/></svg>
            </div>

            <h1 class="text-3xl md:text-4xl font-display font-black text-gray-900 mb-4 tracking-tight uppercase">
                {{ .Title }}
            </h1>
            
            {{ if .Params.description }}
            <p class="text-base md:text-lg text-gray-500 font-sans max-w-2xl mx-auto leading-relaxed">
                {{ .Params.description }}
            </p>
            {{ end }}
        </header>

        <!-- 2. CONTENT AREA -->
        <div class="px-6 py-10 md:px-12 md:py-12">
            <!-- Prose Emerald: Styling teks otomatis cantik untuk legal docs -->
            <div class="prose prose-lg prose-emerald max-w-none text-gray-700 leading-loose prose-headings:font-display prose-headings:font-bold prose-a:text-emerald-600 hover:prose-a:text-emerald-700">
                {{ .Content }}
            </div>

            <!-- Last Updated (Penting untuk Trust) -->
            <div class="mt-12 pt-8 border-t border-stone-100 text-center">
                <p class="text-xs text-gray-400 font-mono uppercase tracking-widest">
                    Last Updated: {{ .Lastmod.Format "January 02, 2006" }}
                </p>
            </div>
        </div>

    </div>

    <!-- 3. BACK TO HOME -->
    <div class="mt-8 text-center">
        <a href="/" class="inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:text-emerald-700 transition-colors uppercase tracking-wider">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Basecamp
        </a>
    </div>

</div>
{{ end }}
